    <link rel="stylesheet" href="style.css" />

  <body>
    <div class="main">

          <div class="score">
            <h3>Hit</h3>
            <div id="hit" class="rounded">–</div>

          </div>

        <div class="btm-panel" id="bubbles">

        </div>
      </div>
    </div>
